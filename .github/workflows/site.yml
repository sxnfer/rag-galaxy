# Builds the site and publishes it to Azure Static Web Apps. Runs whenever the
# frontend changes on main, or by hand from the Actions tab. (Also when the
# backend changes: the journey links to lines of backend code, and those line
# numbers are worked out during the build.)
#
# Needs three settings on the repository (Settings > Secrets and variables > Actions):
#   secret   AZURE_STATIC_WEB_APPS_API_TOKEN   terraform output -raw static_web_app_deploy_token
#   variable API_URL                           terraform output -raw api_url
#   variable SITE_URL                          terraform output -raw frontend_url
name: Site

on:
  push:
    branches: [main]
    paths: ['frontend/**', 'backend/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_SITE_URL: ${{ vars.SITE_URL }}
          VITE_COMMIT: ${{ github.sha }} # the journey's code links open exactly this version
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend/dist # already built above
          skip_app_build: true
          skip_api_build: true
