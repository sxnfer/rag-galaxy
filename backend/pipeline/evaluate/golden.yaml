# The golden set: questions whose right answers we know, used to score retrieval (M4).
#
# Each entry:
#   id:          short unique name
#   library:     ev (the only library today)
#   question:    asked exactly as a user would
#   items:       the cars that should come back, as named in data/seeds/ev/vehicles.csv
#                (the top two or three for the stat asked about; where the 3rd and 4th
#                tie, only the top two, so the right answer is never a coin toss).
#                A test checks every name against the CSV and every stat question
#                against the table itself.
#   answerable:  false for questions the table can't answer
#
# Scored twice by `python -m pipeline eval`: "cards" (search alone) and
# "cards + rank" (search, then sorted by the stat).
