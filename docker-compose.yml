# Local stack: Postgres with pgvector, and the API.
# The frontend runs with `npm run dev` (fast reload); scripts/dev.sh starts everything.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag
    ports: ["127.0.0.1:5432:5432"] # this computer only: the password is a well-known default
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag"]
      interval: 2s
      retries: 30

  api:
    build: ./backend
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/rag
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["./data:/app/data"]
    depends_on:
      db: { condition: service_healthy }
    profiles: ["api"] # `docker compose --profile api up` to run the API in a container too

volumes:
  pgdata:
